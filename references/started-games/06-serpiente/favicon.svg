<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#000"/>

  <!-- Serpiente: cuerpo en zigzag sobre la rejilla -->
  <g fill="#0f0">
    <rect x="4" y="20" width="6" height="6"/>
    <rect x="10" y="20" width="6" height="6" opacity="0.8"/>
    <rect x="10" y="14" width="6" height="6" opacity="0.85"/>
    <rect x="16" y="14" width="6" height="6" opacity="0.9"/>
    <rect x="16" y="8" width="6" height="6"/>
  </g>

  <!-- Cabeza con ojo -->
  <rect x="16" y="8" width="6" height="6" fill="#b6ffb6"/>
  <circle cx="19" cy="11" r="1.2" fill="#0a1a0a"/>

  <!-- Fruta -->
  <circle cx="26" cy="6" r="3" fill="#ff6b6b"/>
</svg>
